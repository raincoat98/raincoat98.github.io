# GitHub Pages에 Astro 사이트를 빌드하고 배포하는 워크플로우
#
name: Deploy Astro site to Pages

on:
  push:
    branches: [main]

  # Actions 탭에서 수동으로 실행할 수 있도록 허용합니다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stats.json이 git 히스토리를 분석하므로 필요합니다
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build with Astro
        run: npm run build # stats.json 생성 → astro build → pagefind 색인
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4